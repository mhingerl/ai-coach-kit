name: Idea or feedback
description: Something you'd like the kit or the extension to do, or something that didn't work
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: Please don't paste API keys, passwords or personal health data here. Issues are public.
  - type: textarea
    id: what
    attributes:
      label: What would you like, or what went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version (from the VERSION file) and extension version
